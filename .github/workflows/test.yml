name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Documentation links
        run: python tools/check_docs.py
      - name: Compile for MicroPython
        run: |
          make mpy
          mpy-cross -o build/main.mpy main.py

  # The same logic on real MicroPython (unix port), to catch what CPython hides. Not blocking: the
  # distribution's MicroPython can be older than the firmware on the board.
  micropython:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y micropython
      - run: micropython tools/mpy_smoke.py
